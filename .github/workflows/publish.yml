# This workflow will run build using node and then publish to github pages

name: gh-pages publisher  🚀

on:
  push:
    branches: [ master ]

jobs:
  publish-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: git config user.name "${{ github.actor }}" && git config user.email "${{ github.actor }}@users.noreply.github.com"
      - run: npm run deploy
        env:
          GH_TOKEN: ${{secrets.SECRET_GITHUB_TOKEN}}
